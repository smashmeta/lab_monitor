name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback loop: lm_core, lm_platform, lm_transport only, no Qt in the
  # dependency graph (LM_BUILD_GUI=OFF, VCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
  # drops the "gui" feature -- and Qt with it -- from the manifest install).
  headless:
    name: Headless / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest ships Visual Studio 2022 (v17), not the "Visual
          # Studio 18 2026" generator the local `windows`/`windows-headless`
          # presets pin (that generator matches the preview VS toolset on
          # the dev machine these presets were authored on, not the hosted
          # runner image). windows-headless-ci is a CI-only sibling preset
          # that inherits everything else from the same hidden base but
          # pins "Visual Studio 17 2022" instead -- see CMakePresets.json.
          - os: windows-latest
            preset: windows-headless-ci
          - os: ubuntu-latest
            preset: linux-headless
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest/ubuntu-latest ship a working vcpkg checkout at
      # VCPKG_INSTALLATION_ROOT; point our manifest build at it instead of
      # cloning our own copy.
      - name: Point VCPKG_ROOT at the runner-provided vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # The manifest's builtin-baseline pins a specific vcpkg-ports commit.
      # Fetch (without checking out) so that commit is resolvable even if
      # it landed after this runner image's vcpkg snapshot was taken.
      - name: Refresh vcpkg ports metadata
        shell: bash
        run: |
          git -C "$VCPKG_ROOT" fetch origin --unshallow --quiet || git -C "$VCPKG_ROOT" fetch origin --quiet

      # linux-headless configures with the Ninja generator (inherited from
      # linux-debug in CMakePresets.json).
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Report toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version || true

      - name: Configure (${{ matrix.preset }})
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      # --output-on-failure so a failing suite is diagnosable straight from
      # the Actions log without re-running anything.
      - name: Test (${{ matrix.preset }})
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # The GUI build: apps/client, apps/server and lm_ui, on top of the same
  # three libraries the headless job already covers. Integration tests stay
  # off (LM_BUILD_INTEGRATION_TESTS defaults OFF and nothing here enables
  # it) -- they need loopback multicast and one of them is known-flaky on a
  # BEST_EFFORT topic, which has no place gating every push.
  full:
    name: Full / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-ci: same "Visual Studio 17 2022" rationale as
          # windows-headless-ci above.
          - os: windows-latest
            configure-preset: windows-ci
            build-preset: windows-ci
            test-preset: windows-ci
          - os: ubuntu-latest
            configure-preset: linux-debug
            build-preset: linux-debug
            test-preset: linux-debug
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point VCPKG_ROOT at the runner-provided vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Refresh vcpkg ports metadata
        shell: bash
        run: |
          git -C "$VCPKG_ROOT" fetch origin --unshallow --quiet || git -C "$VCPKG_ROOT" fetch origin --quiet

      # x-gha reads its cache endpoint/token from the environment; neither is
      # exported to steps by default, so pull them out of the Actions
      # runtime via github-script (the documented recipe for vcpkg's GitHub
      # Actions Cache binary source).
      - name: Export GitHub Actions cache credentials for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # qt5-base/qt5-svg build from source via vcpkg; vcpkg does not vendor
      # the underlying X11/xkb/GL headers a Linux Qt build links against, so
      # they have to come from the system. Fast DDS additionally wants
      # OpenSSL headers on Linux.
      - name: Install Linux GUI + DDS build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-cursor-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev

      - name: Report toolchain versions
        shell: bash
        run: |
          cmake --version
          ninja --version || true

      - name: Configure (${{ matrix.configure-preset }})
        shell: bash
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build (${{ matrix.build-preset }})
        shell: bash
        run: cmake --build --preset ${{ matrix.build-preset }}

      - name: Test (${{ matrix.test-preset }})
        shell: bash
        run: ctest --preset ${{ matrix.test-preset }} --output-on-failure
